<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Harian Kendaraan Pool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .app {
            max-width: 1200px;
            margin: auto;
        }

        /* ================================
           HEADER
        ================================ */

        .header {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .company h1 {
            margin: 0;
            font-size: 20px;
        }

        .company p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #777;
        }

        /* ================================
           CONTROL
        ================================ */

        .control-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;

            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field.search-field {
            flex: 1;
            min-width: 220px;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 10px;

            flex: 1;
            min-width: 220px;
        }

        .field label {
            font-size: 12px;
            font-weight: bold;
        }

        .field select,
        .field input {
            height: 38px;
            padding: 0 10px;

            border: 1px solid #bbb;
            border-radius: 6px;

            background: white;
        }

        #searchNopol,
        #paymentNopol {
            text-transform: uppercase;
        }

        /* ================================
           BUTTON
        ================================ */

        .btn {
            height: 38px;
            padding: 0 15px;

            border: 0;
            border-radius: 6px;

            cursor: pointer;
            font-weight: bold;
        }

        .btn-add {
            background: #00b894;
            color: white;
        }

        .btn-refresh {
            background: #444;
            color: white;
        }

        .btn-print {
            background: #f1c40f;
            color: #222;
        }

        /* ================================
           REPORT
        ================================ */

        .report-card {
            background: white;
            border-radius: 12px;
            padding: 15px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .report-title {
            text-align: center;

            font-size: 22px;
            font-weight: bold;

            text-decoration: underline;

            margin-bottom: 15px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .report-table {
            width: 100%;
            min-width: 900px;

            border-collapse: collapse;
            table-layout: fixed;
        }

        .report-table th,
        .report-table td {
            border: 1px solid #333;

            padding: 6px 5px;

            font-size: 12px;
            line-height: 1.2;

            text-align: center !important;
            vertical-align: middle !important;
        }

        .report-table th {
            background: #ffff00;
            font-weight: bold;
        }

        .report-table tbody tr.nopol-group-odd {
            background: #ffffff;
        }

        .report-table tbody tr.nopol-group-even {
            background: #e1e1e1;
        }

        .date-cell {
            width: 150px;
        }

        .nopol-cell {
            width: 130px;
        }

        .money-cell {
            width: 120px;
        }

        .km-cell {
            width: 100px;
        }

        .ket-cell {
            width: auto;
        }

        .action-cell {
            width: 90px;
        }

        .action-btn {
            border: 0;

            padding: 4px 7px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 11px;

            margin: 1px;
        }

        .update-btn {
            background: #e67e22;
            color: white;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* ================================
           MODAL
        ================================ */

        .modal {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, .55);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 9999;

            padding: 15px;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 550px;

            background: white;

            border-radius: 12px;

            padding: 20px;

            max-height: 90vh;

            overflow-y: auto;
        }

        .modal-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .close-btn {
            border: 0;

            background: #eee;

            width: 32px;
            height: 32px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 18px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;

            gap: 5px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            height: 40px;

            border: 1px solid #bbb;
            border-radius: 6px;

            padding: 0 10px;

            font-size: 14px;
        }

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            margin-top: 20px;
        }

        .btn-cancel {
            background: #ddd;
        }

        .btn-save {
            background: #00b894;
            color: white;
        }

        /* ================================
           LOADING
        ================================ */

        .loading {
            position: fixed;
            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, .7);

            z-index: 10000;
        }

        .loading.show {
            display: flex;
        }

        .loading-box {
            background: white;

            padding: 20px 30px;

            border-radius: 10px;

            box-shadow: 0 3px 15px rgba(0, 0, 0, .2);

            font-weight: bold;
        }

        /* ================================
           MOBILE
        ================================ */

        @media (max-width: 600px) {

            body {
                padding: 8px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .control-card {
                align-items: stretch;
            }

            .field {
                width: 100%;
            }

            .field select,
            .field input,
            .btn {
                width: 100%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }

        /* ================================
           PRINT
        ================================ */

        @media print {

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            @page {
                size: A4 landscape;
                margin: 6mm;
            }

            html,
            body {
                width: 100%;

                margin: 0;
                padding: 0;

                background: white;
            }

            .app {
                width: 100%;
                max-width: none;

                margin: 0;
            }

            .header,
            .control-card,
            .modal,
            .loading {
                display: none !important;
            }

            .report-card {
                width: 100%;

                margin: 0;
                padding: 0;

                border: 0;

                box-shadow: none;
            }

            .report-title {
                font-size: 16px;

                margin: 0 0 8px;

                line-height: 1.2;
            }

            .table-wrapper {
                width: 100%;

                overflow: visible !important;
            }

            .report-table {
                width: 100% !important;

                min-width: 0 !important;
                max-width: none !important;

                table-layout: auto !important;

                border-collapse: collapse;
            }

            .action-cell,
            .report-table td:last-child,
            .report-table th:last-child {
                display: none !important;
            }

            .report-table th,
            .report-table td {
                font-size: 9px !important;

                line-height: 1.2 !important;

                padding: 4px 3px !important;

                color: #000 !important;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- ==========================================
             HEADER
        ========================================== -->

        <div class="header">

            <div class="company">

                <h1>
                    JUMADI MAYAHAN
                </h1>

                <p>
                    PT.JASA MANDIRI TECHGRAHA
                </p>

            </div>

        </div>


        <!-- ==========================================
             CONTROL
        ========================================== -->

        <div class="control-card">

            <div class="search-group">

                <div class="field search-field">

                    <label for="searchNopol">

                    <input

        <!-- ==========================================

        <div class="report-card">

    <!-- ==========================================

    <div

    <div

    <!-- ==========================================
         PDF LIBRARY
    ========================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>


    <script>

        /* ==========================================================
           API URL
        ========================================================== */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbyLHHBbcmfyMW0wMiK5RTV6nsDeJgVqo8lq_EsTg-0mOVXTj7JxfSw6f7MJQICDKSnp/exec";


        let reportData = [];

        let editingId = null;
        let updateMode = false;
        let updatePreviousKmIn = null;
        let updateSelectedDate = null;


        /* ==========================================================
           LOAD AWAL
        ========================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {
                loadData();
            }
        );


        /* ==========================================================
           READ JSON
        ========================================================== */

        async function readJsonResponse(response) {

            const responseText =
                await response.text();


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status +
                    " - " +
                    (
                        response.statusText ||
                        "Request gagal"
                    )
                );

            }


            try {

                return JSON.parse(
                    responseText
                );

            } catch (error) {

                console.error(
                    "Response API bukan JSON:",
                    responseText
                );


                const preview =
                    responseText
                        .replace(/\s+/g, " ")
                        .substring(0, 300);


                throw new Error(
                    "Server tidak mengembalikan JSON. " +
                    "Response awal: " +
                    preview
                );

            }

        }


        /* ==========================================================
           LOAD DATA
        ========================================================== */

        async function loadData() {
showLoading(
                "Mengambil data dari Spreadsheet..."
            );


            try {

                const url =
                    API_URL +
                    "?action=list&_=" +
                    Date.now();


                const response =
                    await fetch(
                        url,
                        {
                            cache: "no-store"
                        }
                    );


                const result =
                    await readJsonResponse(
                        response
                    );


                if (!result.success) {

                    throw new Error(
                        result.message ||
                        "Gagal mengambil data"
                    );

                }


                reportData =
                    Array.isArray(result.data)
                        ? result.data
                        : [];


                /*
                 * ======================================================
                 * TANGGAL TIDAK DIKONVERSI.
                 *
                 * Hanya dibandingkan sebagai STRING.
                 * ======================================================
                 */

                reportData.sort(
                    function (a, b) {

                        return String(
                            b.date || ""
                        )
                            .substring(0, 10)
                            .localeCompare(
                                String(
                                    a.date || ""
                                )
                                    .substring(0, 10)
                            );

                    }
                );


                // Default menampilkan data sampai tanggal online (hari ini).
                document.getElementById("searchDate").value =
                    getTodayDateString();

                renderTable();

            } catch (error) {

                console.error(error);


                alert(
                    "Gagal mengambil data dari Spreadsheet.\n\n" +
                    error.message
                );

            } finally {

                hideLoading();

            }

        }


        /* ==========================================================
           SEARCH
        ========================================================== */

        function applySearch() {

            renderTable();

        }


        /* ==========================================================
           UPPERCASE
        ========================================================== */

        function formatNopolInput(el) {

            const start = el.selectionStart;
            const end = el.selectionEnd;

            const before = el.value;

            /*
             * Nopol selalu huruf besar dan seluruh spasi
             * di dalam text box otomatis dihapus.
             */
            el.value = before
                .toUpperCase()
                .replace(/\s+/g, "");

            const removedBeforeCursor =
                (before.substring(0, start).match(/\s/g) || []).length;

            const newStart = Math.max(0, start - removedBeforeCursor);

            el.setSelectionRange(
                newStart,
                Math.max(0, end - ((before.substring(0, end).match(/\s/g) || []).length))
            );
        }


        function toUpperCaseInput(el) {

            const start =
                el.selectionStart;

            const end =
                el.selectionEnd;


            el.value =
                el.value.toUpperCase();


            el.setSelectionRange(
                start,
                end
            );

        }


        /* ==========================================================
           RENDER TABLE
        ========================================================== */

        function renderTable() {

            const tbody = document.getElementById("reportBody");
            tbody.innerHTML = "";

            /* Reset pola warna setiap render/filter. */
            window._nopolColorMap = {};
            window._nopolColorIndex = 0;
            window._lastNopolForColor = null;

            const keyword = document.getElementById("searchNopol").value.trim().toLowerCase();
            const dateFilter = document.getElementById("searchDate").value;
            const today = getTodayDateString();

            /*
             * Jika tanggal yang dipilih melebihi tanggal hari ini
             * (tanggal aplikasi dibuka), tabel dikosongkan.
             * Tidak ada fallback/carry-forward ke tanggal hari ini.
             */
            if (dateFilter && dateFilter > today) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Tidak ada data</td></tr>';
                return;
            }

            const effectiveDate = dateFilter || today;

            /*
             * LOGIKA TAMPILAN:
             * 1. Semua data yang tanggalnya sama dengan tanggal terpilih
             *    tetap ditampilkan, termasuk bila Nopol yang sama muncul
             *    beberapa kali pada tanggal tersebut.
             * 2. Untuk Nopol yang TIDAK mempunyai data pada tanggal terpilih,
             *    tampilkan 1 data terakhir dari hari-hari sebelumnya.
             *    Data ini hanya tampil di aplikasi dan TIDAK disalin ke
             *    Spreadsheet.
             * 3. Dengan demikian data terbaru otomatis terbawa ke hari
             *    berikutnya sampai ada update baru untuk Nopol tersebut.
             */
            const allValid = reportData.filter(function(row) {
                const rowDate = String(row.date || "").substring(0, 10);
                return rowDate && rowDate <= today;
            });

            let candidates = allValid;

            if (keyword) {
                candidates = candidates.filter(function(row) {
                    return String(row.nopol || "").toLowerCase().includes(keyword);
                });
            }

            /* Semua record pada tanggal yang dipilih. */
            const selectedDateRows = candidates.filter(function(row) {
                return String(row.date || "").substring(0, 10) === effectiveDate;
            });

            /* Nopol yang sudah memiliki data pada tanggal terpilih. */
            const nopolOnSelectedDate = {};
            selectedDateRows.forEach(function(row) {
                const key = String(row.nopol || "").trim().toUpperCase();
                if (key) nopolOnSelectedDate[key] = true;
            });

            /*
             * Untuk Nopol yang belum di-update pada tanggal terpilih,
             * ambil hanya record terakhir sebelum tanggal terpilih.
             */
            const carryForward = {};
            candidates.forEach(function(row) {
                const key = String(row.nopol || "").trim().toUpperCase();
                const rowDate = String(row.date || "").substring(0, 10);
                if (!key || !rowDate || rowDate >= effectiveDate) return;
                if (nopolOnSelectedDate[key]) return;

                if (!carryForward[key] || compareRecordLatest(row, carryForward[key]) > 0) {
                    carryForward[key] = row;
                }
            });

            let filtered = selectedDateRows.concat(
                Object.keys(carryForward).map(function(key) {
                    return carryForward[key];
                })
            );

            /* Urutkan por nopol, kemudian tanggal terbaru berada di bawah. */
            const nopolGroupOrder = {};
            let nopolGroupIndex = 0;

            filtered.forEach(function(row) {
                const key = String(row.nopol || "").trim().toUpperCase();
                if (nopolGroupOrder[key] === undefined) {
                    nopolGroupOrder[key] = nopolGroupIndex++;
                }
            });

            filtered.sort(function(a, b) {
                const keyA = String(a.nopol || "").trim().toUpperCase();
                const keyB = String(b.nopol || "").trim().toUpperCase();

                if (nopolGroupOrder[keyA] !== nopolGroupOrder[keyB]) {
                    return nopolGroupOrder[keyA] - nopolGroupOrder[keyB];
                }

                return compareDisplayTime(a, b);
            });

            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Tidak ada data</td></tr>';
                return;
            }

            filtered.forEach(function(row) {
                const tr = document.createElement("tr");
                const rowDate = String(row.date || "").substring(0, 10);
                /*
                 * Tanggal yang ditampilkan mengikuti tanggal yang dipilih.
                 * Data carry-forward tetap menggunakan nilai BBM/KM/Keterangan
                 * dari record terakhir yang valid, tetapi tanggal tampilannya
                 * mengikuti effectiveDate. Data asli di Spreadsheet tidak diubah.
                 */
                const displayDate = effectiveDate;
                const key = String(row.nopol || "").trim().toUpperCase();

                /*
                 * Update hanya muncul SATU kali pada record paling terbaru
                 * dari Nopol tersebut yang sedang ditampilkan.
                 *
                 * Penting: semua baris dengan Nopol + tanggal yang sama tetap
                 * ditampilkan. Yang dibatasi hanya tombol Update-nya.
                 */
                /*
                 * Tombol Update HANYA boleh muncul pada tanggal HARI INI.
                 * Pada tanggal-tanggal sebelumnya semua data tetap tampil,
                 * tetapi tidak ada tombol Update.
                 *
                 * Jika tanggal yang dipilih adalah hari ini, tombol hanya
                 * muncul pada record Nopol yang waktu update-nya paling baru.
                 */
                const showUpdate =
                    effectiveDate === today &&
                    isMostRecentlyUpdatedNopol(row);

                tr.innerHTML =
                    '<td>' + formatFullDate(displayDate) + '</td>' +
                    '<td>' + escapeHtml(row.nopol || '') + '</td>' +
                    '<td>' + escapeHtml(row.bbm ?? '') + '</td>' +
                    '<td>' + escapeHtml(row.kmIn ?? '') + '</td>' +
                    '<td>' + escapeHtml(row.kmOut ?? '') + '</td>' +
                    '<td>' + escapeHtml(row.keterangan || '') + '</td>' +
                    '<td class="action-cell">' +
                    (showUpdate
                        ? '<button class="action-btn update-btn" onclick="updateFromRow(\'' + escapeJs(row.id) + '\')">Update</button>'
                        : '') +
                    '</td>';

                /* Warna selang-seling berdasarkan Nopol yang sama. */
                if (!window._nopolColorMap[key]) {
                    window._nopolColorIndex++;
                    window._nopolColorMap[key] = window._nopolColorIndex % 2 === 0 ? 'group-even' : 'group-odd';
                }
                tr.classList.add(window._nopolColorMap[key]);
                tbody.appendChild(tr);
            });
        }

        /*
         * Urutan tampilan tabel:
         * - Nopol tetap dikelompokkan.
         * - Dalam satu Nopol, data diurutkan dari waktu paling lama
         *   ke waktu paling baru.
         * - Data yang baru saja di-update selalu berada paling bawah.
         * - updateAt menjadi penentu utama waktu; ID menjadi fallback.
         */
        function compareDisplayTime(a, b) {
            const updateA = getUpdateTimestamp(a && a.updateAt);
            const updateB = getUpdateTimestamp(b && b.updateAt);

            if (updateA !== updateB) {
                if (updateA === 0) return -1;
                if (updateB === 0) return 1;
                return updateA > updateB ? 1 : -1;
            }

            const idA = getRecordTimestamp(a && a.id);
            const idB = getRecordTimestamp(b && b.id);

            if (idA !== idB) {
                return idA > idB ? 1 : -1;
            }

            const textA = String(a && a.id || '');
            const textB = String(b && b.id || '');
            if (textA === textB) return 0;
            return textA > textB ? 1 : -1;
        }


        function getRecordTimestamp(id) {
            /*
             * ID dibuat dengan generateId() menggunakan Date.now()
             * sebagai bagian angka paling depan. Fungsi ini dibuat
             * aman untuk ID lama maupun ID dengan format berbeda.
             */
            const value = String(id == null ? "" : id).trim();
            if (!value) return 0;

            const match = value.match(/^(\d{10,})/);
            if (match) {
                const timestamp = Number(match[1]);
                return Number.isFinite(timestamp) ? timestamp : 0;
            }

            const numeric = Number(value);
            return Number.isFinite(numeric) ? numeric : 0;
        }

        function compareRecordLatest(a, b) {
            const dateA = String(a && a.date || '').substring(0, 10);
            const dateB = String(b && b.date || '').substring(0, 10);

            if (dateA !== dateB) {
                return dateA > dateB ? 1 : -1;
            }

            const timeA = getRecordTimestamp(a && a.id);
            const timeB = getRecordTimestamp(b && b.id);

            if (timeA !== timeB) {
                return timeA > timeB ? 1 : -1;
            }

            const idA = String(a && a.id || '');
            const idB = String(b && b.id || '');

            if (idA === idB) {
                return 0;
            }

            return idA > idB ? 1 : -1;
        }


        function getLatestNopolRecord(nopol) {
            const key = String(nopol || '')
                .trim()
                .toUpperCase();

            if (!key) {
                return null;
            }

            let latest = null;

            reportData.forEach(function(item) {
                const itemKey = String(item.nopol || '')
                    .trim()
                    .toUpperCase();

                if (itemKey !== key) {
                    return;
                }

                if (!latest || compareRecordLatest(item, latest) > 0) {
                    latest = item;
                }
            });

            return latest;
        }


        function isLatestDisplayedRecord(row, displayedRows) {
            if (!row || !Array.isArray(displayedRows)) return false;

            const key = String(row.nopol || '').trim().toUpperCase();
            if (!key) return false;

            let latest = null;

            displayedRows.forEach(function(item) {
                const itemKey = String(item.nopol || '').trim().toUpperCase();
                if (itemKey !== key) return;

                if (!latest || compareRecordLatest(item, latest) > 0) {
                    latest = item;
                }
            });

            return !!latest && String(latest.id || '') === String(row.id || '');
        }

        /*
         * Tombol Update hanya muncul pada record yang benar-benar
         * paling terakhir di-update untuk satu Nopol.
         * Penentu utama adalah timestamp pada ID (Date.now),
         * bukan posisi baris atau tanggal yang sedang ditampilkan.
         * Jika timestamp tidak tersedia, tanggal + ID digunakan sebagai fallback.
         */
        function getUpdateTimestamp(value) {
            /*
             * updateAt adalah waktu update yang sebenarnya dari Spreadsheet.
             * Format normal: YYYY-MM-DD HH:mm:ss.
             * Dibuat fleksibel agar tetap aman jika API mengirim format
             * tanggal/waktu yang sedikit berbeda.
             */
            if (value === null || value === undefined) return 0;

            const text = String(value).trim();
            if (!text) return 0;

            const direct = Date.parse(text.replace(' ', 'T'));
            if (Number.isFinite(direct)) return direct;

            const numeric = Number(text);
            return Number.isFinite(numeric) ? numeric : 0;
        }

        function isMostRecentlyUpdatedNopol(row) {
            /*
             * TOMBOL UPDATE HANYA UNTUK DATA DENGAN WAKTU UPDATE TERBARU
             * UNTUK NOPOL YANG SAMA.
             *
             * Prioritas penentuan:
             * 1. updateAt dari Spreadsheet/API = waktu update sebenarnya.
             * 2. Jika updateAt kosong/tidak terbaca, gunakan timestamp ID.
             * 3. Jika masih sama, gunakan urutan record dari API.
             *
             * Jadi contoh:
             * B1527UJL  Stand by   09:27:56  -> tombol Update
             * B1527UJL  Bengkel    09:27:10  -> tidak ada tombol
             * B1527UJL  Stand by   09:23:51  -> tidak ada tombol
             *
             * Semua data lama tetap ditampilkan.
             */
            if (!row) return false;

            const key = String(row.nopol || '').trim().toUpperCase();
            if (!key) return false;

            let latest = null;
            let latestUpdateTime = -1;
            let latestIdTime = -1;
            let latestIndex = -1;

            reportData.forEach(function(item, index) {
                const itemKey = String(item.nopol || '').trim().toUpperCase();
                if (itemKey !== key) return;

                const updateTime = getUpdateTimestamp(item.updateAt);
                const idTime = getRecordTimestamp(item.id);

                if (!latest ||
                    updateTime > latestUpdateTime ||
                    (updateTime === latestUpdateTime && idTime > latestIdTime) ||
                    (updateTime === latestUpdateTime && idTime === latestIdTime && index > latestIndex)) {
                    latest = item;
                    latestUpdateTime = updateTime;
                    latestIdTime = idTime;
                    latestIndex = index;
                }
            });

            if (!latest) return false;

            return String(latest.id || '') === String(row.id || '');
        }

        function isLatestNopol(row) {
            if (!row) return false;

            const rowNopol = String(row.nopol || '').trim().toUpperCase();
            if (!rowNopol) return false;

            /*
             * Tombol UPDATE hanya muncul pada record dengan WAKTU UPDATE
             * PALING BARU untuk Nopol tersebut.
             *
             * Timestamp pada ID menjadi penentu utama. Tanggal data tidak
             * digunakan untuk memilih tombol, sehingga record yang benar-benar
             * terakhir di-update akan selalu menjadi satu-satunya pemilik tombol.
             */
            let latest = null;
            let latestTime = -1;

            reportData.forEach(function(item) {
                const itemNopol = String(item.nopol || '').trim().toUpperCase();
                if (itemNopol !== rowNopol) return;

                const itemTime = getRecordTimestamp(item.id);
                const latestId = String(latest && latest.id || '');
                const itemId = String(item.id || '');

                if (itemTime > latestTime ||
                    (itemTime === latestTime && itemId > latestId)) {
                    latest = item;
                    latestTime = itemTime;
                }
            });

            return !!latest && String(latest.id || '') === String(row.id || '');
        }

        function isLatestNopolAtSelectedDate(row, dateFilter) {
            if (!row) return false;
            const today = getTodayDateString();
            const effectiveDate = dateFilter ? (dateFilter > today ? today : dateFilter) : today;
            const key = String(row.nopol || '').trim().toUpperCase();
            if (!key) return false;
            let latest = null;
            reportData.forEach(function(item) {
                const itemKey = String(item.nopol || '').trim().toUpperCase();
                const itemDate = String(item.date || '').substring(0, 10);
                if (itemKey !== key || !itemDate || itemDate > effectiveDate || itemDate > today) return;
                if (!latest || compareRecordLatest(item, latest) > 0) latest = item;
            });
            return !!latest && String(latest.id || '') === String(row.id || '');
        }

        /* ==========================================================
           SAVE
        ========================================================== */

        async function savePayment() {

            let dateStr =
                document.getElementById(
                    "paymentDate"
                ).value;

            if (updateMode && updateSelectedDate) {
                dateStr = updateSelectedDate;
            }


            if (!dateStr) {

                alert(
                    "Tanggal harus diisi."
                );

                return;

            }


            const nopol =
                document.getElementById(
                    "paymentNopol"
                )
                    .value
                    .trim()
                    .toUpperCase();


            if (!nopol) {

                alert(
                    "Nopol harus diisi."
                );

                return;

            }


            const kmOutCheck =
                document.getElementById(
                    "paymentKmOut"
                )
                    .value
                    .trim();


            const kmInCheck =
                document.getElementById(
                    "paymentKmIn"
                )
                    .value
                    .trim();


            /*
             * Apabila KM Out sudah terisi,
             * KM In wajib diisi terlebih
             * dahulu.
             */

            if (
                kmOutCheck &&
                !kmInCheck
            ) {

                alert(
                    "KM Out sudah terisi. " +
                    "KM In harus diisi terlebih dahulu."
                );

                document.getElementById(
                    "paymentKmIn"
                ).focus();

                return;

            }


            /*
             * Validasi khusus pada card Update:
             * KM In baru tidak boleh lebih kecil dari
             * KM In sebelum data di-update.
             */
            if (
                updatePreviousKmIn !== null &&
                updatePreviousKmIn !== ""
            ) {

                const previousKmIn =
                    Number(updatePreviousKmIn);

                const currentKmIn =
                    Number(kmInCheck);

                if (
                    !kmInCheck ||
                    !Number.isFinite(currentKmIn) ||
                    currentKmIn < previousKmIn
                ) {

                    alert(
                        "KM In baru harus sama atau lebih besar dari KM In sebelum di-update (" +
                        previousKmIn +
                        ")."
                    );

                    document.getElementById(
                        "paymentKmIn"
                    ).focus();

                    return;

                }
            }


            const wasEditing =
                !!editingId;

            // UPDATE CARD = simpan isi card sebagai DATA BARU.
            // Jangan diarahkan kembali ke Update walaupun Nopol sudah ada.
            const isUpdateCard = !!updateMode;

            /*
             * NOPOL BARU TIDAK BOLEH DUPLIKAT.
             * Jika Nopol sudah ada di Spreadsheet, jangan membuat
             * baris baru. Alihkan langsung ke card UPDATE yang sama
             * dengan tombol Update pada tabel.
             *
             * Saat sedang benar-benar mengedit data (editingId terisi),
             * pengecekan ini tidak dijalankan.
             */
            if (!wasEditing && !isUpdateCard) {
                const existingRow =
                    reportData.find(function (item) {
                        return String(item.nopol || '')
                            .trim()
                            .toUpperCase() === nopol;
                    });

                if (existingRow) {
                    alert(
                        'Nopol ' + nopol +
                        ' sudah ada di Spreadsheet.\n\n' +
                        'Data akan dialihkan ke UPDATE.'
                    );

                    openUpdateModal(nopol);
                    return;
                }
            }


            const data = {

                id:
                    editingId ||
                    generateId(),

                /*
                 * Input type=date memberikan
                 * string YYYY-MM-DD.
                 *
                 * String ini dikirim langsung.
                 */

                date:
                    String(dateStr)
                        .substring(0, 10),

                nopol:
                    nopol,

                bbm:
                    numberValue(
                        document.getElementById(
                            "paymentBBM"
                        ).value
                    ),

                kmIn:
                    document.getElementById(
                        "paymentKmIn"
                    ).value.trim(),

                kmOut:
                    document.getElementById(
                        "paymentKmOut"
                    ).value.trim(),

                keterangan:
                    document.getElementById(
                        "paymentKeterangan"
                    ).value.trim()

            };


            if (
                !confirm(
                    "Data sudah benar?"
                )
            ) {

                return;

            }


            showLoading(
                "Menyimpan data..."
            );


            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "text/plain;charset=utf-8"
                            },

                            body:
                                JSON.stringify({
                                    action:
                                        wasEditing && !isUpdateCard
                                            ? "update"
                                            : "add",

                                    data:
                                        data
                                })
                        }
                    );


                const result =
                    await readJsonResponse(
                        response
                    );


                if (!result.success) {

                    throw new Error(
                        result.message ||
                        "Gagal menyimpan"
                    );

                }


                closePaymentModal();

                await loadData();


                alert(
                    wasEditing
                        ? "Data berhasil diperbarui."
                        : "Data berhasil disimpan."
                );

                updatePreviousKmIn = null;

            } catch (error) {

                console.error(error);


                alert(
                    "Gagal menyimpan data.\n\n" +
                    error.message
                );

            } finally {

                hideLoading();

            }

        }


        /* ==========================================================
           UPDATE (SALINAN DATA BERDASARKAN NOPOL)

           Tombol "Update" pada kolom Action.

           - Mencari data TERAKHIR untuk nopol yang sama dari
             SELURUH hari sebelumnya (bukan hanya baris yang diklik).

           - Menampilkan card input dan mengisi seluruh text box
             (Nopol, BBM, KM In, KM Out, Keterangan) dari data
             tersebut.

           - Apabila data sebelumnya memiliki KM Out, maka text box
             KM In DIKOSONGKAN dan wajib diisi ulang oleh user
             (divalidasi di savePayment()).

           - Saat disimpan, data ini dianggap data BARU (editingId
             = null), sehingga data lama tetap ada di tabel dan
             data hasil update menjadi acuan salinan berikutnya.
        ========================================================== */

        function updateFromRow(id) {

            const row =
                reportData.find(
                    function (item) {

                        return String(
                            item.id
                        ) === String(id);

                    }
                );


            if (!row) {

                alert(
                    "Data tidak ditemukan."
                );

                return;

            }


            openUpdateModal(
                row.nopol
            );

        }


        function openUpdateModal(nopol) {

            const nopolUpper =
                String(nopol || "")
                    .trim()
                    .toUpperCase();


            if (!nopolUpper) {

                alert(
                    "Nopol tidak valid."
                );

                return;

            }


            /*
             * Ambil seluruh riwayat nopol ini
             * dari seluruh hari sebelumnya.
             */

            const history =
                reportData.filter(
                    function (item) {

                        return String(
                            item.nopol || ""
                        )
                            .trim()
                            .toUpperCase() ===
                            nopolUpper;

                    }
                );


            if (!history.length) {

                alert(
                    "Data sebelumnya untuk nopol " +
                    nopolUpper +
                    " tidak ditemukan."
                );

                return;

            }


            /*
             * Ambil data TERBARU berdasarkan Nopol dari seluruh riwayat.
             * Tidak bergantung pada urutan reportData.
             */

            const latest =
                getLatestNopolRecord(nopolUpper);


            editingId = null;
            updateMode = true;

            /* Simpan KM In dari data sebelum update untuk validasi Save. */
            updatePreviousKmIn =
                latest.kmIn === undefined ||
                latest.kmIn === null
                    ? ""
                    : String(latest.kmIn).trim();

            clearPaymentForm();


            document.getElementById(
                "paymentModalTitle"
            ).textContent =
                "Update Data (Salinan " +
                nopolUpper +
                ")";


            /*
             * Saat UPDATE dibuka, tanggal harus otomatis mengikuti
             * tanggal yang sedang dipilih pada filter utama.
             * Tanggal UPDATE tidak boleh diubah oleh user.
             */
            const selectedDate =
                document.getElementById("searchDate").value ||
                getTodayDateString();

            const todayForUpdate = getTodayDateString();
            updateSelectedDate =
                selectedDate > todayForUpdate
                    ? todayForUpdate
                    : selectedDate;

            document.getElementById(
                "paymentDate"
            ).value = updateSelectedDate;

            document.getElementById(
                "paymentDate"
            ).readOnly = true;
            document.getElementById(
                "paymentDate"
            ).setAttribute("disabled", "disabled");


            document.getElementById(
                "paymentNopol"
            ).value =
                nopolUpper;


            document.getElementById(
                "paymentBBM"
            ).value =
                numberValue(
                    latest.bbm
                ) || "";


            /*
             * Seluruh data terakhir (BBM, KM In,
             * KM Out, Keterangan) disalin apa
             * adanya ke form.
             */

            document.getElementById(
                "paymentKmIn"
            ).value =
                latest.kmIn || "";


            document.getElementById(
                "paymentKmOut"
            ).value =
                latest.kmOut || "";


            document.getElementById(
                "paymentKeterangan"
            ).value =
                latest.keterangan || "";


            document
                .getElementById(
                    "paymentModal"
                )
                .classList
                .add("show");

        }


        /* ==========================================================
           PRINT / PDF
        ========================================================== */

        async function triggerPrint() {

            const keyword =
                document
                    .getElementById(
                        "searchNopol"
                    )
                    .value
                    .trim()
                    .toLowerCase();


            const dateFilter =
                document
                    .getElementById(
                        "searchDate"
                    )
                    .value;


            let data =
                reportData;


            if (keyword) {

                data =
                    data.filter(
                        function (row) {

                            return String(
                                row.nopol || ""
                            )
                                .toLowerCase()
                                .includes(
                                    keyword
                                );

                        }
                    );

            }


            /*
             * TANGGAL TERPILIH MENJADI BATAS AKHIR TAMPILAN.
             *
             * Data tanggal sebelumnya tetap ikut ditampilkan pada
             * tanggal berikutnya, tetapi TIDAK dibuat/salin menjadi
             * baris baru di Spreadsheet. Data hanya berasal dari
             * reportData yang sudah ada.
             *
             * Jika tanggal terpilih melewati hari ini, otomatis
             * dibatasi sampai hari ini. Data masa depan tidak pernah
             * ditampilkan.
             */
            const today = getTodayDateString();
            const effectiveDate = dateFilter
                ? (dateFilter > today ? today : dateFilter)
                : today;

            data =
                data.filter(
                    function (row) {

                        const rowDate = String(
                            row.date || ""
                        ).substring(0, 10);

                        return rowDate &&
                            rowDate <= effectiveDate &&
                            rowDate <= today;

                    }
                );

            /*
             * PDF mengikuti tampilan aplikasi:
             * hanya record paling ter-update per Nopol dari data
             * Spreadsheet sampai tanggal yang dipilih.
             */
            const latestPdfByNopol = {};

            data.forEach(function(row) {
                const key = String(row.nopol || "")
                    .trim()
                    .toUpperCase();

                if (!key) return;

                if (
                    !latestPdfByNopol[key] ||
                    compareRecordLatest(row, latestPdfByNopol[key]) > 0
                ) {
                    latestPdfByNopol[key] = row;
                }
            });

            data = Object.keys(latestPdfByNopol).map(function(key) {
                return latestPdfByNopol[key];
            });


            showLoading(
                "Membuat PDF..."
            );


            try {

                const {
                    jsPDF
                } =
                    window.jspdf;


                const doc =
                    new jsPDF({
                        orientation:
                            "portrait",

                        unit:
                            "mm",

                        format:
                            "a4"
                    });


                /*
                 * Semua teks PDF hitam.
                 */

                doc.setTextColor(
                    0,
                    0,
                    0
                );


                const pageWidth =
                    doc.internal.pageSize
                        .getWidth();


                doc.setFont(
                    undefined,
                    "bold"
                );


                doc.setFontSize(
                    14
                );


                const title =
                    "DATA HARIAN KENDARAAN POOL";


                doc.text(
                    title,
                    pageWidth / 2,
                    12,
                    {
                        align: "center"
                    }
                );


                const titleWidth =
                    doc.getTextWidth(
                        title
                    );


                doc.setLineWidth(
                    0.3
                );


                doc.line(
                    pageWidth / 2 -
                        titleWidth / 2,

                    13.3,

                    pageWidth / 2 +
                        titleWidth / 2,

                    13.3
                );

                /*
                 * PERIODE TANGGAL TERPILIH
                 */
                doc.setFont(
                    undefined,
                    "normal"
                );
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);

                let periodeText = "Periode";

                if (dateFilter) {
                    periodeText += " " + formatFullDate(dateFilter);
                }

                doc.text(
                    periodeText,
                    pageWidth / 2,
                    18,
                    {
                        align: "center"
                    }
                );


                /*
                 * ======================================================
                 * BODY PDF
                 *
                 * formatFullDate() tidak memakai
                 * new Date().
                 * ======================================================
                 */

                const body =
                    data.length

                        ? data.map(
                            function (row) {

                                return [

                                    formatFullDate(
                                        row.date
                                    ),

                                    row.nopol || "",

                                    numberValue(
                                        row.bbm
                                    ),

                                    row.kmIn || "",

                                    row.kmOut || "",

                                    row.keterangan || ""

                                ];

                            }
                        )

                        : [

                            [
                                "-",
                                "-",
                                "-",
                                "-",
                                "-",
                                "Belum ada data"
                            ]

                        ];


                // Warna PDF mengikuti kelompok Nopol seperti tabel aplikasi.
                const pdfNopolColorMap = {};
                let pdfNopolColorIndex = 0;

                data.forEach(function (row) {
                    const nopolKey = String(row.nopol || "")
                        .trim()
                        .toUpperCase();

                    if (pdfNopolColorMap[nopolKey] === undefined) {
                        pdfNopolColorMap[nopolKey] = pdfNopolColorIndex % 2;
                        pdfNopolColorIndex++;
                    }
                });

                doc.autoTable({

                    startY: 25,

                    theme: "grid",

                    styles: {

                        fontSize: 9,

                        cellPadding: 2,

                        lineColor:
                            [51, 51, 51],

                        lineWidth:
                            0.15,

                        textColor:
                            [0, 0, 0],

                        halign:
                            "center",

                        valign:
                            "middle"

                    },

                    headStyles: {

                        fillColor:
                            [255, 255, 0],

                        textColor:
                            [0, 0, 0],

                        fontStyle:
                            "bold",

                        halign:
                            "center"

                    },

                    head: [

                        [
                            "Tanggal",
                            "Nopol",
                            "BBM",
                            "KM In",
                            "KM Out",
                            "Keterangan"
                        ]

                    ],

                    body:
                        body,

                    columnStyles: {

                        2: {
                            halign: "center"
                        }

                    },

                    didParseCell: function (hookData) {
                        if (hookData.section === "body" && data.length) {
                            const row = data[hookData.row.index];
                            const nopolKey = String(row.nopol || "")
                                .trim()
                                .toUpperCase();

                            hookData.cell.styles.fillColor =
                                pdfNopolColorMap[nopolKey] === 1
                                    ? [225, 225, 225]
                                    : [255, 255, 255];
                        }
                    }

                });


                /*
                 * ======================================================
                 * NOMOR HALAMAN
                 * ======================================================
                 */

                const totalPages =
                    doc.getNumberOfPages();


                for (
                    let pageNum = 1;
                    pageNum <= totalPages;
                    pageNum++
                ) {

                    doc.setPage(
                        pageNum
                    );


                    doc.setFontSize(
                        8
                    );


                    doc.setTextColor(
                        0,
                        0,
                        0
                    );


                    doc.text(

                        pageNum +
                        "/" +
                        totalPages,

                        pageWidth / 2,

                        doc.internal.pageSize
                            .getHeight() - 4,

                        {
                            align:
                                "center"
                        }

                    );

                }


                doc.save(
                    "data-harian-kendaraan-pool.pdf"
                );

            } catch (error) {

                console.error(error);


                alert(
                    "Gagal membuat PDF.\n\n" +
                    error.message
                );

            } finally {

                hideLoading();

            }

        }


        /* ==========================================================
           GET DATE ONLY

           TIDAK MENGGUNAKAN new Date().

           Contoh:

           2026-08-31
           2026-08-31T00:00:00
           2026-08-31 00:00:00

           semuanya menjadi:

           2026-08-31
        ========================================================== */

        function getTodayDateString() {

            const now = new Date();

            const year =
                now.getFullYear();

            const month =
                String(now.getMonth() + 1).padStart(2, "0");

            const day =
                String(now.getDate()).padStart(2, "0");

            return year + "-" + month + "-" + day;

        }


        function getDateOnly(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return "";

            }


            const str =
                String(value).trim();


            const match =
                str.match(
                    /^(\d{4})-(\d{2})-(\d{2})/
                );


            if (match) {

                return (
                    match[1] +
                    "-" +
                    match[2] +
                    "-" +
                    match[3]
                );

            }


            return str;

        }


        /* ==========================================================
           FORMAT DATE

           TIDAK ADA new Date().

           2026-08-31

           ↓

           31 Agustus 2026
        ========================================================== */

        function formatFullDate(value) {

            const date =
                getDateOnly(value);


            if (!date) {

                return "-";

            }


            const match =
                date.match(
                    /^(\d{4})-(\d{2})-(\d{2})$/
                );


            if (!match) {

                return escapeHtml(
                    date
                );

            }


            const year =
                match[1];


            const month =
                parseInt(
                    match[2],
                    10
                );


            const day =
                parseInt(
                    match[3],
                    10
                );


            const months = [

                "Januari",
                "Februari",
                "Maret",
                "April",
                "Mei",
                "Juni",
                "Juli",
                "Agustus",
                "September",
                "Oktober",
                "November",
                "Desember"

            ];


            if (
                month < 1 ||
                month > 12
            ) {

                return escapeHtml(
                    date
                );

            }


            return (

                day +
                " " +
                months[
                    month - 1
                ] +
                " " +
                year

            );

        }


        /* ==========================================================
           NUMBER
        ========================================================== */

        function numberValue(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return 0;

            }


            if (
                typeof value === "number"
            ) {

                return value;

            }


            return Number(

                String(value)
                    .replace(
                        /[^\d]/g,
                        ""
                    )

            ) || 0;

        }


        /* ==========================================================
           GENERATE ID
        ========================================================== */

        function generateId() {

            return (

                Date.now().toString() +

                Math.random()
                    .toString(36)
                    .substring(2, 8)

            );

        }


        /* ==========================================================
           ESCAPE HTML
        ========================================================== */

        function escapeHtml(value) {

            return String(
                value || ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==========================================================
           ESCAPE JAVASCRIPT
        ========================================================== */

        function escapeJs(value) {

            return String(
                value || ""
            )

                .replace(
                    /\\/g,
                    "\\\\"
                )

                .replace(
                    /'/g,
                    "\\'"
                )

                .replace(
                    /"/g,
                    '\\"'
                )

                .replace(
                    /\r/g,
                    "\\r"
                )

                .replace(
                    /\n/g,
                    "\\n"
                );

        }


        /* ==========================================================
           LOADING
        ========================================================== */

        function showLoading(text) {

            document.querySelector(
                ".loading-box"
            ).textContent =
                text ||
                "Loading...";


            document
                .getElementById(
                    "loading"
                )
                .classList
                .add("show");

        }


        function hideLoading() {

            document
                .getElementById(
                    "loading"
                )
                .classList
                .remove("show");

        }


        /* ==========================================================
           CLICK OUTSIDE MODAL
        ========================================================== */

        document
            .getElementById(
                "paymentModal"
            )
            .addEventListener(
                "click",
                function (e) {

                    if (
                        e.target === this
                    ) {

                        closePaymentModal();

                    }

                }
            );

    </script>
